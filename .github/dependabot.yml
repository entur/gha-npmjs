version: 2
updates:
  - package-ecosystem: github-actions
    # "/" only covers .github/workflows, so the composite actions are listed too.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 5
      exclude:
        - "entur/*"
