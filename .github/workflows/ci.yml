name: Entur/Npmjs/CI

on:
  pull_request:
    # `edited` is not in the default set (opened, synchronize, reopened), so without it a PR
    # title fixed after a failed verify-pr run stays red until an unrelated commit is pushed.
    # Re-running the failed run does not help either: it replays the original webhook payload,
    # which still carries the old title.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# A called workflow can never request more than its caller grants, and GitHub validates
# the whole call graph when the run starts, not when a job is reached. Every dry-run job
# below calls release.yml, which statically references entur/gha-meta's release.yml
# (contents/issues/pull-requests: write) even though its release job is gated behind
# `if: !inputs.dry_run` and never executes here. Without these scopes the run ends in
# startup_failure with zero jobs.
permissions:
  contents: write # entur/gha-meta release-please, via release.yml
  issues: write # entur/gha-meta release-please, via release.yml
  pull-requests: write # entur/gha-meta release-please and verify-pr
  id-token: write # Required by the publish job in release.yml

jobs:
  verify-pr:
    name: Verify PR
    if: ${{ github.event_name == 'pull_request' }}
    uses: entur/gha-meta/.github/workflows/verify-pr.yml@c14eef7f4d90ed1be2c1df4dfb0927322bcbb3ba # v1.9.0

  # Dry run against the fixture package: installs with mise, builds, and runs
  # `npm publish --dry-run` without touching the registry.
  test-release-dry-run-npm:
    uses: ./.github/workflows/release.yml
    with:
      path: fixture/npm-package
      dry_run: true
      package_manager: npm

  test-release-dry-run-dist-tag:
    uses: ./.github/workflows/release.yml
    with:
      path: fixture/npm-package
      dry_run: true
      dist_tag: next
      provenance: false

  # Monorepo dry run: release-please manifest mode with lerna-style workspaces,
  # publishing every package listed in .release-please-manifest.json
  test-release-dry-run-monorepo-npm:
    uses: ./.github/workflows/release.yml
    with:
      path: fixture/monorepo-npm
      release_type: manifest
      dry_run: true

  # Same monorepo, but with an explicit package list instead of the manifest.
  # Listed dependent-first on purpose: common depends on util, so the publish step has to
  # reorder them. The step summary must show util published before common.
  test-release-dry-run-monorepo-npm-explicit-packages:
    uses: ./.github/workflows/release.yml
    with:
      path: fixture/monorepo-npm
      dry_run: true
      packages: |
        packages/common
        packages/util

  # One dry run per package manager: mise resolves the pinned tool, the workflow
  # installs with a frozen lockfile, builds, and publishes through the npm CLI
  test-release-dry-run-pnpm:
    uses: ./.github/workflows/release.yml
    with:
      path: fixture/pnpm-package
      package_manager: pnpm
      dry_run: true

  test-release-dry-run-yarn:
    uses: ./.github/workflows/release.yml
    with:
      path: fixture/yarn-package
      package_manager: yarn
      dry_run: true

  test-release-dry-run-bun:
    uses: ./.github/workflows/release.yml
    with:
      path: fixture/bun-package
      package_manager: bun
      dry_run: true

  # Monorepos using the workspace: protocol. The publish step must pack with the
  # repository's package manager, so the ranges are rewritten to real semver before
  # the tarball reaches npm
  test-release-dry-run-monorepo-pnpm:
    uses: ./.github/workflows/release.yml
    with:
      path: fixture/monorepo-pnpm
      package_manager: pnpm
      release_type: manifest
      dry_run: true

  test-release-dry-run-monorepo-yarn:
    uses: ./.github/workflows/release.yml
    with:
      path: fixture/monorepo-yarn
      package_manager: yarn
      release_type: manifest
      dry_run: true

  test-release-dry-run-monorepo-bun:
    uses: ./.github/workflows/release.yml
    with:
      path: fixture/monorepo-bun
      package_manager: bun
      release_type: manifest
      dry_run: true
