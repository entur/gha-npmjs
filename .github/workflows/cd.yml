name: Entur/Npmjs/CD
on:
  push:
    branches:
      - main
permissions:
  pull-requests: write
  contents: write
  issues: write
  actions: read
  id-token: write
jobs:
  release:
    uses: entur/gha-meta/.github/workflows/release.yml@c3ca051ef943942321084a21ec919bc8097dfd92 # v1.9.1
  update-docs:
    needs: release
    if: needs.release.outputs.releases_created == 'false' && needs.release.outputs.prs_created == 'true'
    strategy:
      max-parallel: 1 # One at a time, because each job commits to the same branch
      matrix:
        files:
          - workflow: .github/workflows/publish.yml
            readme: README-publish.md
    uses: entur/gha-meta/.github/workflows/auto-doc.yml@c3ca051ef943942321084a21ec919bc8097dfd92 # v1.9.1
    with:
      commit_default_author: 'github_actions'
      target_branch: 'release-please--branches--main'
      workflow_file: ${{ matrix.files.workflow }}
      readme_file: ${{ matrix.files.readme }}
